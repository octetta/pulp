@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
    --atari-blue: #0042ff;
    --atari-dark: #001a66;
    --atari-gold: #ffd700;
    --atari-light: #90b0ff;
    --atari-rust: #FF3C3C;
    --atari-grass: #afff00;
    --bar-bg: #1a2a1a; 
}

body {
    background-color: #000000; 
    display: flex;
    flex-direction: column;
    height: 100dvh; 
    margin: 0;
    overflow: hidden; 
}

#terminal-container {
    background-color: var(--atari-blue);
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: manipulation;
}

#output {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px;
    white-space: pre-wrap;
    line-height: 1.5;
    -webkit-overflow-scrolling: touch;
    touch-action: manipulation;
}

.terminal-spacer {
    height: 70%;
    width: 100%;
}
